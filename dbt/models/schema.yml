version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: "ref('stg_customers')", field: customer_id}
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
  - name: stg_items
    columns:
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: "ref('stg_orders')", field: order_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: "ref('stg_products')", field: product_id}
      - name: seller_id
        data_tests:
          - relationships:
              arguments: {to: "ref('stg_sellers')", field: seller_id}
  - name: fct_orders
    description: One row per order before observation_end; GMV is not Olist revenue.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
  - name: int_zip
    columns:
      - name: zip_prefix
        data_tests: [unique, not_null]
